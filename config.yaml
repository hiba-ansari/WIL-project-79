domains:
  travel_insurance:
    display_name: "Travel Insurance PDS"
    raw_docs_dir: "data/travel_insurance/raw_docs"
    chunks_dir: "data/travel_insurance/chunks"
    vectordb_dir: "data/travel_insurance/vectordb"
    system_prompt: |
      You are a travel insurance policy assistant. 
      Answer questions based ONLY on the provided policy document excerpts. 
      If the excerpts do not contain the specific fact required, say so — do not substitute a related concept.
      Tables in the excerpts may have stripped formatting; read them row by row, matching benefit names to their limits.
      Always cite the source document and section when answering.
      For every claim in your answer, quote the exact supporting sentence(s) verbatim before stating the conclusion. 
      Do not make up coverage details, exclusions, or conditions that are not stated in the provided text.

ingestion:
  chunk_size: 500
  chunk_overlap: 100

retrieval:
  top_k: 5

llm:
  model: "llama3"
  temperature: 0.1

embeddings:
  model: "nomic-embed-text"
